name: Bot da Laufey

on:
  schedule:
    # Horários em UTC. Brasília = UTC-3: cobre 06:02 → 23:52 (BRT), a cada 10 min.
    - cron: '2,12,22,32,42,52 9-23 * * *'
    - cron: '2,12,22,32,42,52 0-2 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Forçar um post de teste (on off curiosidade data musica icon isso poll quiz resposta mecore jogo news) — deixe vazio para execução normal'
        required: false
        default: ''
      max_posts:
        description: 'Máximo de posts nesta execução (padrão 6)'
        required: false
        default: ''

permissions:
  contents: write
  actions: write

concurrency:
  group: laufey-bot
  cancel-in-progress: false

jobs:
  postar:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --omit=dev --no-audit --no-fund

      - name: Garantir ffmpeg (prévia em voz)
        run: |
          node -e "import('ffmpeg-static').then(m=>process.exit(require('fs').existsSync(m.default)?0:1),()=>process.exit(1))" || command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)

      # O agendador do GitHub atrasa/pula execuções (rodou só 2x num dia).
      # Por isso cada execução fica ~5h40 rodando o bot a cada 10 min e, no fim,
      # dispara a próxima. O cron acima só serve pra religar a corrente se ela cair.
      - name: Rodar o bot (a cada 10 min)
        env:
          AUTH_KEY: ${{ secrets.AUTH_KEY }}
          CHANNEL_JID: ${{ secrets.CHANNEL_JID }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          FORCE: ${{ github.event.inputs.force }}
          MAX_POSTS: ${{ github.event.inputs.max_posts }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "laufey-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          salvar() {
            git add state.json auth.enc
            if git diff --cached --quiet; then return 0; fi
            git commit -q -m "bot: atualiza estado"
            git pull -q --rebase --autostash || true
            git push -q || echo "⚠️ push falhou"
          }
          fim=$(( $(date +%s) + 340*60 ))
          while :; do
            node src/run.js || echo "⚠️ execução falhou"
            salvar
            # teste forçado: roda uma vez só
            if [ -n "$FORCE" ]; then exit 0; fi
            unset MAX_POSTS
            agora=$(date +%s)
            prox=$(( (agora/600 + 1)*600 + 120 ))   # próximo :x2 (02, 12, 22...)
            if [ $prox -ge $fim ]; then break; fi
            sleep $(( prox - agora ))
          done
          echo "🔁 Disparando a próxima execução"
          gh workflow run bot.yml --repo "$GITHUB_REPOSITORY" --ref main || echo "⚠️ não consegui disparar a próxima"
